name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AGP 不会自动下载 SDK，必须显式装
      - name: 安装 Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL --retry 3 -o ct.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ct.zip
          mv cmdline-tools latest
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 每次 CI 都是全新机器，默认的 debug.keystore 是现生成的 —— 签名每版都不同，
      # 手机上就必须先卸载旧版才能装。这里把固定密钥解出来给 Gradle 用。
      - name: 准备固定签名密钥
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "!! 没有配置 ANDROID_KEYSTORE_BASE64，本次用临时签名（装之前要先卸载旧版）"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/phonemic.jks"
          echo "PHONEMIC_KEYSTORE=$GITHUB_WORKSPACE/phonemic.jks" >> $GITHUB_ENV
          echo "PHONEMIC_KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> $GITHUB_ENV
          echo "PHONEMIC_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "PHONEMIC_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
          echo "已载入固定签名密钥（指纹应每次都一致）"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/phonemic.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASS }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            | grep -E "SHA1|SHA256" || true

      - name: 编译 Debug APK
        run: |
          chmod +x ./gradlew
          # pipefail 必须开：否则 tee 会掩盖 gradlew 的失败退出码，
          # 构建挂了 CI 却显示绿色，产物为空
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # 打印签名指纹：换机器/换密钥时能一眼看出来，指纹不变才能直接覆盖安装
      - name: 校验 APK 签名
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneMic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 失败时留下日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
